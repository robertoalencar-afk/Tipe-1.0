name: Publicar no Instagram
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Nome do post em social-posts/ (vazio = rodar a agenda)"
        required: false
      teste:
        description: "Só validar token e conta, sem publicar"
        type: boolean
        default: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST: ${{ inputs.post }}
          TESTE: ${{ inputs.teste }}
          AGENDA: ${{ (github.event_name == 'schedule' || inputs.post == '') && '1' || '0' }}
        run: python3 scripts/publicar-instagram.py
