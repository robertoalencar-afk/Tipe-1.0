name: Publicar no Instagram
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Nome do post em social-posts/ (ex.: c017)"
        required: true
      teste:
        description: "Só validar token e conta, sem publicar"
        type: boolean
        default: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST: ${{ inputs.post }}
          TESTE: ${{ inputs.teste }}
        run: python3 scripts/publicar-instagram.py
