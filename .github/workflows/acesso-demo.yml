# Acesso único de demonstração: um usuário (padrão roberto@tipe.digital) entra como dono,
# caixa e garçom das empresas virtuais e no backoffice, com a senha do segredo SENHA_TESTE.
name: Acesso de demonstração

on:
  workflow_dispatch:
    inputs:
      verificar_cardapio:
        description: Testar mídia com login real nas empresas virtuais (sem alterar permissões)
        type: boolean
        default: false
      email:
        description: E-mail que entra em todas as áreas de simulação
        required: false
        default: roberto@tipe.digital

jobs:
  liberar:
    if: ${{ !inputs.verificar_cardapio }}
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/db/acesso-demo.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENHA_TESTE: ${{ secrets.SENHA_TESTE }}
          DEMO_EMAIL: ${{ inputs.email }}

  verificar-cardapio:
    if: ${{ inputs.verificar_cardapio }}
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Smoke autenticado de mídia em empresas virtuais
        run: bunx vitest run --config scripts/tests/cardapio-storage.smoke.config.ts
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://bnggnbwmihqexvihrqvy.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_VBd0grDcguwpR_gyqa2nEw_kW40dW4s' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
