# Publica a TIPE na Cloudflare a cada push no main (e manualmente pela aba Actions).
# Configuração em docs/deploy/README.md.
name: Publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testar-pedidos-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste-local-ci
          POSTGRES_DB: tipe_order_review_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Testar conferência de pedidos em banco isolado
        env:
          TIPE_SQL_TEST_URL: postgresql://postgres:teste-local-ci@localhost:5432/tipe_order_review_test
        run: bash scripts/db/tests/customer-order-review.sh

  testar-fiscal-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste-local-ci
          POSTGRES_DB: tipe_fiscal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Testar isolamento, fila fiscal e preservação da venda
        env:
          TIPE_SQL_TEST_URL: postgresql://postgres:teste-local-ci@localhost:5432/tipe_fiscal_test
        run: bash scripts/db/tests/fiscal.sh

  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verificar sintaxe do configurador (sem acessar segredos)
        run: bash -n scripts/deploy/configurar-github.sh
      - name: Verificar ordem dos Hooks do painel
        run: >-
          bunx eslint src/components/tipe/RestaurantPanel.tsx --rule 'prettier/prettier: off'
      - run: bunx tsc --noEmit -p .
      - name: Instalar PostgreSQL isolado para testes da Lebre
        run: npm install --prefix "$RUNNER_TEMP/lebre-sql" --no-audit --no-fund @electric-sql/pglite@0.5.16
      - name: Testar operações da Lebre em PostgreSQL isolado
        env:
          PGLITE_MODULE: ${{ runner.temp }}/lebre-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/db/tests/lebre-operation.mjs
      - run: bunx vitest run
      - name: Testar métricas do cardápio e isolamento entre restaurantes
        env:
          PGLITE_MODULE: ${{ runner.temp }}/lebre-sql/node_modules/@electric-sql/pglite/dist/index.js
        run: node scripts/db/tests/menu-intelligence.mjs
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://bnggnbwmihqexvihrqvy.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_VBd0grDcguwpR_gyqa2nEw_kW40dW4s' }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'bnggnbwmihqexvihrqvy' }}

  publicar:
    needs: [testar, testar-pedidos-sql, testar-fiscal-sql]
    # Ativação explícita impede publicar em tipe.digital antes do Supabase e dos segredos estarem prontos.
    # Defina a repository variable TIPE_PRODUCTION_READY=true somente no momento do go-live.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.TIPE_PRODUCTION_READY == 'true'
    runs-on: ubuntu-latest
    environment: producao
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validar ambiente de produção antes de tocar no banco ou publicar
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://bnggnbwmihqexvihrqvy.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_VBd0grDcguwpR_gyqa2nEw_kW40dW4s' }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'bnggnbwmihqexvihrqvy' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TIPE_ENCRYPTION_KEY: ${{ secrets.TIPE_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          required=(DATABASE_URL VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_PROJECT_ID SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY CRON_SECRET TIPE_ENCRYPTION_KEY)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Configuração incompleta::Variável obrigatória ausente: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Deploy bloqueado; nenhuma migração executada e nenhum Worker publicado."
            exit 1
          fi
          # A IA da Lebre é grátis (Cloudflare Workers AI, depois Groq); sem as duas, ela só responde o que não precisa de IA.
          # O Workers AI vem pelo binding do Worker (sem token); o Groq é a reserva grátis.
          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "::warning title=Lebre sem reserva::Sem GROQ_API_KEY, a Lebre só usa a cota grátis diária do Workers AI."
          fi
          # Evita misturar a service key ou o banco de staging com o URL publico de production.
          expected_id="bnggnbwmihqexvihrqvy"
          expected_url="https://bnggnbwmihqexvihrqvy.supabase.co"
          if [[ "$VITE_SUPABASE_PROJECT_ID" != "$expected_id" || "$VITE_SUPABASE_URL" != "$expected_url" ]]; then
            echo "::error title=Supabase incorreto::Dados publicos nao correspondem a tipe-production."
            exit 1
          fi
          if [[ "$DATABASE_URL" != *"$expected_id"* ]]; then
            echo "::error title=Banco incorreto::DATABASE_URL deve apontar para tipe-production, nunca tipe-staging."
            exit 1
          fi
      - name: Migrações do banco
        run: scripts/db/aplicar-migracoes.sh
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://bnggnbwmihqexvihrqvy.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_VBd0grDcguwpR_gyqa2nEw_kW40dW4s' }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'bnggnbwmihqexvihrqvy' }}
      - name: Publicar o site
        shell: bash
        run: |
          # O domínio canônico é gerenciado pelo Worker; www redireciona no edge.
          # Qualquer erro de publicação deve falhar o job, inclusive erro de domínio.
          set -euo pipefail
          bunx wrangler deploy
          node scripts/deploy/segredos.mjs app | bunx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://bnggnbwmihqexvihrqvy.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_VBd0grDcguwpR_gyqa2nEw_kW40dW4s' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TIPE_ENCRYPTION_KEY: ${{ secrets.TIPE_ENCRYPTION_KEY }}
          PAGARME_SECRET_KEY: ${{ secrets.PAGARME_SECRET_KEY }}
          PAGARME_PUBLIC_KEY: ${{ secrets.PAGARME_PUBLIC_KEY }}
          PAGARME_WEBHOOK_SECRET: ${{ secrets.PAGARME_WEBHOOK_SECRET }}
          PAGARME_TIPE_RECIPIENT_ID: ${{ secrets.PAGARME_TIPE_RECIPIENT_ID }}
          TIPE_PLATFORM_FEE_PERCENT: ${{ vars.TIPE_PLATFORM_FEE_PERCENT }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          GOOGLE_PAY_MERCHANT_ID: ${{ vars.GOOGLE_PAY_MERCHANT_ID }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
          CLOUDFLARE_AI_DAILY_LIMIT: ${{ vars.CLOUDFLARE_AI_DAILY_LIMIT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_VISION_MODEL: ${{ vars.GROQ_VISION_MODEL }}
          LEBRE_CLAUDE_FALLBACK: ${{ vars.LEBRE_CLAUDE_FALLBACK }}
      - name: E-mails do Supabase (cadastro, convite, senha, avisos)
        # Precisa do segredo SUPABASE_ACCESS_TOKEN; sem ele só avisa. Ver docs/deploy/emails-supabase.md.
        run: node scripts/emails/aplicar-emails-auth.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID || 'bnggnbwmihqexvihrqvy' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Publicar as rotinas agendadas
        run: |
          bunx wrangler deploy --config cron-worker/wrangler.jsonc
          node scripts/deploy/segredos.mjs cron | bunx wrangler secret bulk --config cron-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
