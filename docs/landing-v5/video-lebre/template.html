<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A lebre e a tartaruga</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  Tipe · "A lebre e a tartaruga" — animação determinística para vídeo da landing.
  Abra com ?ar=16x9 (1600x900) ou ?ar=4x5 (1080x1350). ?t=5.2 congela num instante.
  Sem parâmetro t, toca em loop no navegador (prévia). Na captura, o script chama
  window.render(t) quadro a quadro (30 fps) e tira screenshot.
  V5.1: os personagens ganharam vida. Cada prato é desenhado num <canvas> WebGL que deforma
  a imagem em camadas suaves (orelhas, cabeça, respiração, mão, relógio, balões) e fecha os
  olhos comprimindo a região do olho na vertical (piscada). Rig em rig.js (embutido no build).
  As telas do celular são as telas reais do app (conta, métodos, pagamento realizado).
  Linha do tempo (s): 0–3.5 tartaruga · 3.5–4.3 wipe de bigodes · 4.3–8 lebres ·
  8–11.1 celular (conta → pagamento → aprovado) · 11.1–12.5 assinatura · 12.5–13 volta ao início.
-->
<style>
@font-face{font-family:"Inter Tight";src:url(__FONT__) format("woff2");font-weight:100 900;font-style:normal}
:root{--turq:#0FC9BD;--navy:#021E34;--off:#F6F5F1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#021E34;overflow:hidden}
#stage{position:relative;overflow:hidden;font-family:"Inter Tight",system-ui,sans-serif;color:var(--navy);background:var(--off);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.layer{position:absolute;inset:0}
.plate{position:absolute;left:0;top:0;transform-origin:0 0;display:block}
.cap{position:absolute;font-weight:400;letter-spacing:-0.045em;line-height:1.02}
.cap .w{display:inline-block;will-change:transform,opacity}
.eyebrow{position:absolute;font-weight:500;letter-spacing:-0.01em;display:flex;align-items:center;gap:.6em;white-space:nowrap}
.eyebrow i{display:inline-block;width:.55em;height:.55em;border-radius:50%}
.status{position:absolute;font-weight:500;letter-spacing:-0.005em;color:rgba(2,30,52,.62);white-space:nowrap;font-variant-numeric:tabular-nums}
.hl{position:relative;display:inline-block}
.hl .ul{position:absolute;left:0;height:.075em;bottom:-.06em;border-radius:99px;background:var(--turq);width:0}
#bar{position:absolute;left:0;right:0;bottom:0}
#barFill{position:absolute;left:0;top:0;bottom:0;width:0}
#logoTop{position:absolute}
#phoneWrap{position:absolute;transform-origin:50% 60%}
.device{position:absolute;inset:0;background:#0b1520;box-shadow:0 2px 0 1px rgba(255,255,255,.06) inset,0 40px 80px -30px rgba(2,30,52,.45),0 18px 36px -18px rgba(2,30,52,.35)}
.screen{position:absolute;overflow:hidden;background:#fff}
.screen img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.notch{position:absolute;left:50%;transform:translateX(-50%);background:#0b1520;border-radius:99px}
.tap{position:absolute;border-radius:50%;background:rgba(15,201,189,.35);border:2px solid rgba(15,201,189,.9);transform:translate(-50%,-50%)}
#badge{position:absolute;border-radius:50%;background:var(--turq);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgba(15,201,189,.7)}
#ring{position:absolute;border-radius:50%;border:3px solid var(--turq)}
#steps .s{display:block}
#end{position:absolute;inset:0;pointer-events:none}
#iris{position:absolute;border-radius:50%;background:var(--navy)}
#endLogo{position:absolute;left:50%}
#endTag{position:absolute;left:0;right:0;text-align:center;color:#F6F5F1;font-weight:400;letter-spacing:-0.045em}
#wipe{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <!-- cenas (pratos estendidos a partir de cada metade do díptico) -->
  <div class="layer" id="scT"><canvas class="plate" id="pT" data-src="__T-cliente__"></canvas></div>
  <div class="layer" id="scH1"><canvas class="plate" id="pH1" data-src="__H-cliente__"></canvas></div>
  <div class="layer" id="scH2"><canvas class="plate" id="pH2" data-src="__H-amigos__"></canvas></div>
  <div class="layer" id="scH3"><canvas class="plate" id="pH3" data-src="__H-gorjeta__"></canvas></div>

  <!-- cena do celular -->
  <div class="layer" id="scP" style="background:radial-gradient(120% 90% at 70% 45%,#FFFFFF 0%,#F6F5F1 55%,#EDEBE4 100%)">
    <div id="phoneWrap">
      <div class="device" id="device">
        <div class="screen" id="screen">
          <img id="s0" src="__conta__"><img id="s1" src="__metodos__"><img id="s2" src="__pago__">
          <div class="tap" id="tap"></div>
        </div>
      </div>
      <div id="ring"></div>
      <div id="badge"><svg viewBox="0 0 24 24" width="56%" height="56%"><path id="chk" d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div>
    </div>
  </div>

  <!-- textos -->
  <div class="eyebrow" id="eb1"><i style="background:#8B9686"></i><span>A tartaruga</span></div>
  <div class="cap" id="cap1"></div>
  <div class="status" id="st1"></div>

  <div class="eyebrow" id="eb2"><i style="background:var(--turq)"></i><span>A lebre</span></div>
  <div class="cap" id="cap2"></div>
  <div class="status" id="st2">Conta paga · na hora</div>

  <div class="eyebrow" id="eb3"><i style="background:var(--turq)"></i><span>Com a Tipe, no celular</span></div>
  <div class="cap" id="cap3"></div>

  <img id="logoTop" src="__logo__" alt="Tipe">
  <div id="bar"><div id="barFill"></div></div>

  <svg id="wipe"></svg>

  <div id="end">
    <div id="iris"></div>
    <img id="endLogo" src="__logoBranco__" alt="Tipe">
    <div id="endTag"><span class="w" id="tg1">Pague.</span> <span class="w" id="tg2" style="color:var(--turq)">Sem esperar.</span></div>
  </div>
</div>

<script>
const META = __META__;
const params = new URLSearchParams(location.search);
const AR = params.get('ar') === '4x5' ? '4x5' : '16x9';
const DUR = 13;

/* ---------- layout por proporção ---------- */
const L = AR === '16x9' ? {
  W:1600, H:900,
  capSize:80, ebSize:22, stSize:22, gap:22,
  c1:{x:110, y:330}, c2:{x:880, y:330},
  T:{ax:.5, ay:.56, sx0:1132, sx1:1118, sy:478, s0:1.03, s1:1.12},
  H1:{ax:0, ay:.5, sx0:-24, sx1:-52, sy:452, s0:1.10, s1:1.04},
  H2:{ax:.5, ay:.52, sx0:428, sx1:452, sy:462, s0:1.09, s1:1.03},
  H3:{ax:0, ay:.5, sx0:-24, sx1:-52, sy:452, s0:1.10, s1:1.04},
  logo:{w:96, right:64, top:58},
  bar:5,
  phone:{cx:1110, cy:466, sh:744},
  c3:{x:110, y:268, size:92, stacked:true},
  endLogo:300, endTag:60, endGap:46
} : {
  W:1080, H:1350,
  capSize:92, ebSize:28, stSize:27, gap:26,
  c1:{x:72, y:150}, c2:{x:72, y:150},
  T:{ax:.5, ay:.56, sx0:540, sx1:540, sy:884, s0:1.30, s1:1.40},
  H1:{ax:0, ay:.5, sx0:-20, sx1:-44, sy:902, s0:1.20, s1:1.14},
  H2:{ax:.5, ay:.5, sx0:540, sx1:556, sy:905, s0:1.24, s1:1.18},
  H3:{ax:0, ay:.5, sx0:-20, sx1:-44, sy:902, s0:1.20, s1:1.14},
  logo:{w:112, right:72, top:84},
  bar:6,
  phone:{cx:540, cy:850, sh:800},
  c3:{x:72, y:150, size:72, stacked:false},
  endLogo:400, endTag:84, endGap:56
};
const W = L.W, H = L.H;
const $ = id => document.getElementById(id);
const stage = $('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

/* ---------- easing ---------- */
function bez(x1,y1,x2,y2){
  const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx, cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t, dsx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{ if(x<=0) return 0; if(x>=1) return 1; let t=x;
    for(let i=0;i<8;i++){const d=sx(t)-x; if(Math.abs(d)<1e-6) break; const dd=dsx(t); if(Math.abs(dd)<1e-6) break; t-=d/dd;}
    let lo=0,hi=1; for(let i=0;i<30 && Math.abs(sx(t)-x)>1e-6;i++){ if(sx(t)<x) lo=t; else hi=t; t=(lo+hi)/2; }
    return sy(t); };
}
const E = bez(0.16,1,0.3,1);           // easing da marca
const IO = bez(0.65,0,0.35,1);         // in-out para wipes
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const backOut=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};

/* ---------- montagem ---------- */
function words(el, lines, size){
  el.style.fontSize = size + 'px';
  el.innerHTML = lines.map(l => '<span style="display:block;white-space:nowrap">' + l.map(w => {
    if (typeof w === 'object') return `<span class="w hl" data-k="${w.k}">${w.t}<span class="ul"></span></span>`;
    return `<span class="w">${w}</span>`;
  }).join(' ') + '</span>').join('');
  return [...el.querySelectorAll('.w')];
}
const w1 = words($('cap1'), [['Do','jeito','antigo,'],['a','conta',{t:'demora.',k:'dem'}]], L.capSize);
const w2 = words($('cap2'), [['Com','a','Tipe,'],['ela','chega',{t:'na&nbsp;hora.',k:'hora'}]], L.capSize);
const dem = $('cap1').querySelector('[data-k=dem]');
const horaUl = $('cap2').querySelector('[data-k=hora] .ul');

// passos da cena do celular
const steps = ['Conta.','Pagamento.','Pronto.'];
$('cap3').style.fontSize = L.c3.size + 'px';
$('cap3').innerHTML = steps.map(s => `<span class="w s"${L.c3.stacked?' style="display:block"':' style="display:inline-block;margin-right:.24em"'}>${s}</span>`).join('');
const w3 = [...$('cap3').querySelectorAll('.w')];

function placeText(){
  for (const [eb, cap, st, c] of [['eb1','cap1','st1',L.c1],['eb2','cap2','st2',L.c2]]) {
    $(eb).style.fontSize = L.ebSize+'px'; $(eb).style.left = c.x+'px'; $(eb).style.top = c.y+'px';
    $(cap).style.left = c.x+'px'; $(cap).style.top = (c.y + L.ebSize*1.2 + L.gap) + 'px';
    const capH = $(cap).offsetHeight;
    $(st).style.fontSize = L.stSize+'px'; $(st).style.left = c.x+'px';
    $(st).style.top = (c.y + L.ebSize*1.2 + L.gap + capH + L.gap*1.3) + 'px';
  }
  $('eb3').style.fontSize = L.ebSize+'px'; $('eb3').style.left = L.c3.x+'px'; $('eb3').style.top = L.c3.y+'px';
  $('cap3').style.left = L.c3.x+'px'; $('cap3').style.top = (L.c3.y + L.ebSize*1.2 + L.gap)+'px';
  const lg=$('logoTop'); lg.style.width=L.logo.w+'px'; lg.style.right=L.logo.right+'px'; lg.style.top=L.logo.top+'px';
  $('bar').style.height = L.bar+'px';
}

// celular
const ph = L.phone, scrH = ph.sh, scrW = Math.round(scrH*780/1688), bez_ = Math.round(scrH*0.017);
const devW = scrW + bez_*2, devH = scrH + bez_*2;
(function(){
  const pw=$('phoneWrap'); pw.style.width=devW+'px'; pw.style.height=devH+'px';
  pw.style.left=(ph.cx-devW/2)+'px'; pw.style.top=(ph.cy-devH/2)+'px';
  const d=$('device'); d.style.borderRadius=Math.round(devW*0.145)+'px';
  const s=$('screen'); s.style.left=s.style.top=bez_+'px'; s.style.width=scrW+'px'; s.style.height=scrH+'px';
  s.style.borderRadius=Math.round(devW*0.145-bez_)+'px';
  const b=$('badge'), bs=Math.round(devW*0.2); b.style.width=b.style.height=bs+'px';
  b.style.left=(devW-bs*0.62)+'px'; b.style.top=(devH*0.16)+'px';
  const r=$('ring'); r.style.width=r.style.height=bs+'px'; r.style.left=b.style.left; r.style.top=b.style.top;
})();

// assinatura
(function(){
  const lg=$('endLogo'); lg.style.width=L.endLogo+'px';
  const lh=L.endLogo*141/462; const tagH=L.endTag*1.1; const total=lh+L.endGap+tagH;
  const top=(H-total)/2;
  lg.style.top=top+'px'; lg.style.marginLeft=(-L.endLogo/2)+'px';
  const tg=$('endTag'); tg.style.fontSize=L.endTag+'px'; tg.style.top=(top+lh+L.endGap)+'px'; tg.style.lineHeight='1.1';
})();

// wipe: três bigodes (traços curvos, pontas redondas)
const NS='http://www.w3.org/2000/svg';
const wipe=$('wipe'); wipe.setAttribute('viewBox',`0 0 ${W} ${H}`); wipe.setAttribute('width',W); wipe.setAttribute('height',H);
const band = H/3 + 150, LEN = W*2.2, BOW = H*0.07;
const wcol = ['#5ADBD2','#0FC9BD','#0AAEA4'];
const wstag = [0.10*W, 0, -0.10*W];   // topo lidera, base vem atrás
const strokes = wcol.map((c,i)=>{
  const p=document.createElementNS(NS,'path');
  const y=H*(1+2*i)/6;
  p.setAttribute('d',`M0 ${y} C ${LEN*0.33} ${y-BOW} ${LEN*0.66} ${y-BOW} ${LEN} ${y}`);
  p.setAttribute('fill','none'); p.setAttribute('stroke',c); p.setAttribute('stroke-width',band); p.setAttribute('stroke-linecap','round');
  wipe.appendChild(p); return p;
});
// fios finos (o bigode em si) que antecedem o wipe
const hairs = [0,1,2].map(i=>{
  const p=document.createElementNS(NS,'path');
  const y=H*(0.40+0.1*i);
  p.setAttribute('d',`M0 ${y} C ${W*0.3} ${y-BOW*(1-i*0.5)} ${W*0.6} ${y-BOW*(1-i*0.5)} ${W*0.95} ${y+(i-1)*H*0.06}`);
  p.setAttribute('fill','none'); p.setAttribute('stroke','#0FC9BD'); p.setAttribute('stroke-width',Math.max(4,H*0.006));
  p.setAttribute('stroke-linecap','round'); p.setAttribute('pathLength','1'); p.setAttribute('stroke-dasharray','1');
  return p;
});

/* ---------- utilidades de render ---------- */
function place(el, key, s, ax, ay, sx, sy){
  const m=META[key];
  const tx = sx - (m.ix + ax*m.iw)*s, ty = sy - (m.iy + ay*m.ih)*s;
  el.style.transform = `translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${s.toFixed(5)})`;
}
function show(el, o){ el.style.opacity = o; el.style.visibility = o<=0.001?'hidden':'visible'; }
function revealWords(ws, t, start, step, dur, out){
  ws.forEach((w,i)=>{
    const p = E(P(t, start+i*step, start+i*step+dur));
    let o = p, y = (1-p)*0.42;
    if (out){ const q = IO(P(t,out[0],out[1])); o *= 1-q; y -= q*0.25; }
    w.style.opacity = o.toFixed(3);
    w.style.transform = `translateY(${y.toFixed(3)}em)`;
    w.style.filter = p<1 ? `blur(${((1-p)*10).toFixed(2)}px)` : 'none';
  });
}
function fadeEl(el, t, a, b, out, dy=10){
  const p=E(P(t,a,b)); let o=p, y=(1-p)*dy;
  if(out){ const q=IO(P(t,out[0],out[1])); o*=1-q; }
  el.style.opacity=o.toFixed(3); el.style.transform=`translateY(${y.toFixed(2)}px)`;
  el.style.visibility = o<=0.001?'hidden':'visible';
}

__RIG__
/* ---------- render(t) ---------- */
const T_WIPE0=3.5, T_WIPE1=4.3, T_H2=5.55, T_H3=6.8, T_PH=7.85, T_IRIS=11.1, T_LOOP=12.5;

function render(tReal){
  const t = tReal >= T_LOOP ? 0 : tReal;   // na volta, a cena base é o primeiro quadro

  // --- tartaruga ---
  const pT = t / T_WIPE1;
  const sT = lerp(L.T.s0, L.T.s1, IO(clamp(pT))*0.35 + clamp(pT)*0.65);
  place($('pT'), 'T-cliente', sT, L.T.ax, L.T.ay, lerp(L.T.sx0, L.T.sx1, clamp(pT)), L.T.sy);
  if (t < T_WIPE1) drawRig('pT', 'T-cliente', t);

  // a troca de base acontece no meio do wipe (tela coberta)
  const wp = IO(P(t, T_WIPE0, T_WIPE1));
  const swapped = t >= T_WIPE0 + (T_WIPE1-T_WIPE0)*0.5;
  show($('scT'), swapped ? 0 : 1);

  // --- lebres ---
  const hk=[['scH1','pH1','H-cliente',L.H1, T_WIPE0+0.4, T_H2+0.2],
            ['scH2','pH2','H-amigos', L.H2, T_H2, T_H3+0.2],
            ['scH3','pH3','H-gorjeta',L.H3, T_H3, T_PH+0.6]];
  hk.forEach(([sc,img,key,c,a,b],i)=>{
    const local = P(t, a, b);
    const s = lerp(c.s0, c.s1, E(local));
    place($(img), key, s, c.ax, c.ay, lerp(c.sx0, c.sx1, local), c.sy);
    let o;
    if (i===0) o = swapped && t < T_H2+0.2 ? 1 : 0;
    else o = P(t, a, a+0.18);
    if (t >= b) o = 0;
    show($(sc), o);
    if (o > 0) drawRig(img, key, t);
  });

  // --- textos tartaruga ---
  fadeEl($('eb1'), t, 0.05, 0.6, null);
  revealWords(w1, t, 0.3, 0.2, 0.7, null);
  const stretch = E(P(t, 1.7, 3.4));
  dem.style.letterSpacing = lerp(-0.045, 0.045, stretch).toFixed(4)+'em';
  const mins = 14 + Math.floor(clamp(t-0.9,0,9)/0.8);
  $('st1').textContent = `Esperando a conta · há ${Math.min(mins,17)} min`;
  fadeEl($('st1'), t, 0.9, 1.5, null);
  const t1vis = swapped ? 0 : 1;
  if(!t1vis) ['eb1','cap1','st1'].forEach(id=>show($(id),0)); else show($('cap1'),1);

  // --- textos lebre ---
  const outH=[T_PH-0.05, T_PH+0.25];
  fadeEl($('eb2'), t, 4.2, 4.6, outH);
  revealWords(w2, t, 4.25, 0.075, 0.55, outH);
  horaUl.style.width = (E(P(t,4.95,5.45))*100).toFixed(2)+'%';
  fadeEl($('st2'), t, 4.7, 5.1, outH);

  // --- barra de progresso ---
  const bf=$('barFill');
  if (!swapped){ bf.style.background='rgba(2,30,52,.42)'; bf.style.width=(clamp(t/T_WIPE0)*13).toFixed(3)+'%'; }
  else { bf.style.background='#0FC9BD'; bf.style.width=(E(P(t,4.35,5.0))*100).toFixed(3)+'%'; }
  $('bar').style.background='rgba(2,30,52,.08)';
  show($('bar'), 1-IO(P(t, T_PH, T_PH+0.3)));

  // logo no topo
  show($('logoTop'), (1-IO(P(t, T_PH, T_PH+0.3))) * E(P(t,0.1,0.8)));

  // --- celular ---
  const pin = IO(P(t, T_PH, T_PH+0.32));
  show($('scP'), t < T_IRIS+0.8 ? pin : 0);
  const rise = E(P(t, T_PH+0.1, T_PH+1.0));
  const floatY = Math.sin((t-T_PH)*1.6)*4*rise;
  $('phoneWrap').style.transform = `translateY(${((1-rise)*H*0.75 + floatY).toFixed(2)}px) rotate(${((1-rise)*-7).toFixed(3)}deg)`;
  const nav = E(P(t, 9.05, 9.5)) + E(P(t, 9.85, 10.3));
  ['s0','s1','s2'].forEach((id,i)=>{
    const x=(i-nav)*100;
    $(id).style.transform=`translateX(${x.toFixed(3)}%)`;
    $(id).style.visibility = Math.abs(x)<100 ? 'visible':'hidden';
  });
  // toques
  const tap=$('tap'); const taps=[[8.72,0.48,0.524],[9.58,0.5,0.899]];
  let tapO=0; for(const [tt,x,y] of taps){ const q=P(t,tt,tt+0.42); if(q>0&&q<1){
    const sz=lerp(scrW*0.10,scrW*0.24,E(q)); tap.style.width=tap.style.height=sz+'px';
    tap.style.left=(x*scrW)+'px'; tap.style.top=(y*scrH)+'px'; tapO=Math.sin(q*Math.PI); } }
  show(tap, tapO);
  // selo de aprovado
  const bp = P(t, 10.3, 10.75);
  $('badge').style.transform = `scale(${bp>0?backOut(bp).toFixed(4):0})`;
  show($('badge'), bp>0?1:0);
  $('chk').setAttribute('stroke-dashoffset', (1-E(P(t,10.48,10.9))).toFixed(4));
  const rp = P(t, 10.42, 11.1);
  $('ring').style.transform = `scale(${lerp(1,2.8,E(rp)).toFixed(4)})`;
  show($('ring'), rp>0 && rp<1 ? (1-rp)*0.9 : 0);
  // textos do celular
  fadeEl($('eb3'), t, T_PH+0.25, T_PH+0.7, null);
  const act = t<9.05?0 : t<9.85?1 : 2;
  w3.forEach((w,i)=>{
    const p=E(P(t, T_PH+0.32+i*0.09, T_PH+0.32+i*0.09+0.6));
    const on = i===act;
    const k = E(P(t, [0,9.05,9.85][i], [0,9.05,9.85][i]+0.3));
    const lvl = i===0 ? (act===0?1:0.22) : (i<=act ? lerp(0.22,1,k) : 0.22);
    const lv = (i===0 && act>0) ? lerp(1,0.22,E(P(t,9.05,9.35))) : (i===1 && act>1) ? lerp(1,0.22,E(P(t,9.85,10.15))) : lvl;
    w.style.color = (i===2 && act===2) ? `rgba(2,30,52,1)` : `rgba(2,30,52,${lv.toFixed(3)})`;
    w.style.opacity = p.toFixed(3);
    w.style.transform = `translateY(${((1-p)*0.4).toFixed(3)}em)`;
    w.style.filter = p<1?`blur(${((1-p)*8).toFixed(2)}px)`:'none';
  });
  const showP = t >= T_PH-0.05 && t < T_IRIS+0.8;
  if(!showP) ['eb3','cap3'].forEach(id=>show($(id),0)); else show($('cap3'),1);

  // --- wipe ---
  const wOn = t >= T_WIPE0-0.35 && t <= T_WIPE1+0.05;
  wipe.style.visibility = wOn ? 'visible':'hidden';
  if (wOn){
    const head = lerp(-0.12*W, W + LEN + 0.12*W, wp);
    strokes.forEach((p,i)=>{ p.setAttribute('transform', `translate(${(head - LEN + wstag[i]).toFixed(2)} 0)`); });
    hairs.forEach((p,i)=>{
      const a=T_WIPE0-0.35+i*0.05, q=E(P(t,a,a+0.45));
      p.setAttribute('stroke-dashoffset',(1-q).toFixed(4));
      p.style.opacity = (1-P(t,T_WIPE0+0.15,T_WIPE0+0.3)).toFixed(3);
    });
  }

  // --- assinatura (usa o tempo real) ---
  const end=$('end');
  if (tReal >= T_IRIS){
    const bRect = { x: ph.cx + devW/2 - devW*0.2*0.12, y: ph.cy - devH/2 + devH*0.16 + devW*0.1 };
    const maxR = Math.hypot(Math.max(bRect.x, W-bRect.x), Math.max(bRect.y, H-bRect.y));
    const r = maxR * IO(P(tReal, T_IRIS, T_IRIS+0.55));
    const ir=$('iris'); ir.style.width=ir.style.height=(2*r)+'px'; ir.style.left=(bRect.x-r)+'px'; ir.style.top=(bRect.y-r)+'px';
    fadeEl($('endLogo'), tReal, T_IRIS+0.35, T_IRIS+0.95, null, 18);
    const g1=E(P(tReal,T_IRIS+0.55,T_IRIS+1.05)), g2=E(P(tReal,T_IRIS+0.72,T_IRIS+1.22));
    [[$('tg1'),g1],[$('tg2'),g2]].forEach(([el,g])=>{ el.style.opacity=g; el.style.transform=`translateY(${((1-g)*0.35).toFixed(3)}em)`; el.style.filter=g<1?`blur(${((1-g)*8).toFixed(2)}px)`:'none'; });
    show(end, 1 - IO(P(tReal, T_LOOP, DUR)));
  } else show(end, 0);
}

placeText();
window.render = render;
window.DUR = DUR;
window.LAYOUT = {W,H};
window.ready = (async()=>{ await document.fonts.ready; await Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))); await initRigs(); placeText(); return true; })();

// prévia no navegador
if (!navigator.webdriver){
  const ft = params.get('t');
  window.ready.then(()=>{
    if (ft !== null) { render(parseFloat(ft)); return; }
    const t0 = performance.now();
    const loop = now => { render(((now - t0)/1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
