name: Verificar infraestrutura Tipe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verificar-infra.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Conferir servicos sem fazer deploy
    runs-on: ubuntu-latest
    environment: producao
    timeout-minutes: 8
    env:
      EXPECTED_SUPABASE_REF: bnggnbwmihqexvihrqvy
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      TIPE_ENCRYPTION_KEY: ${{ secrets.TIPE_ENCRYPTION_KEY }}
    steps:
      - name: Verificar presenca dos segredos e isolamento da producao
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL SUPABASE_SERVICE_ROLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ANTHROPIC_API_KEY RESEND_API_KEY CRON_SECRET TIPE_ENCRYPTION_KEY VITE_SUPABASE_URL VITE_SUPABASE_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Segredo ausente::$name nao cadastrado no ambiente/repository."
              exit 1
            fi
          done
          [[ "$VITE_SUPABASE_PROJECT_ID" == "$EXPECTED_SUPABASE_REF" ]] || { echo "::error::Project ID incorreto."; exit 1; }
          [[ "$VITE_SUPABASE_URL" == "https://$EXPECTED_SUPABASE_REF.supabase.co" ]] || { echo "::error::Project URL incorreta."; exit 1; }
          [[ "$DATABASE_URL" == *"$EXPECTED_SUPABASE_REF"* ]] || { echo "::error::DATABASE_URL nao aponta para tipe-production."; exit 1; }
          echo "Variaveis presentes e apontando para tipe-production (valores ocultos)."

      - name: Consultar PostgreSQL em modo somente leitura
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          export PGCONNECT_TIMEOUT=15
          result="$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "select (select count(*) from tipe_meta.migracoes)::text || ':' || (select count(*) from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE')::text;")"
          [[ "$result" =~ ^[0-9]+:[0-9]+$ ]] || { echo "::error::Resposta inesperada do PostgreSQL."; exit 1; }
          migrations="${result%%:*}"; tables="${result##*:}"
          (( migrations >= 38 && tables >= 43 )) || { echo "::error::Banco incompleto."; exit 1; }
          echo "PostgreSQL OK: $migrations migracoes, $tables tabelas."

      - name: Verificar chave de servidor do Supabase (leitura)
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" "$VITE_SUPABASE_URL/rest/v1/restaurants?select=id&limit=0")"
          [[ "$code" == "200" ]] || { echo "::error::Acesso API Supabase falhou (HTTP $code). Verifique chave secreta correta."; exit 1; }
          echo "Supabase REST OK."

      - name: Verificar token Cloudflare sem implantar Worker
        shell: bash
        run: |
          set -euo pipefail
          user_code="$(curl --silent --show-error --max-time 20 --output /tmp/cf-verify.json --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [[ "$user_code" != "200" ]]; then
            account_code="$(curl --silent --show-error --max-time 20 --output /tmp/cf-verify.json --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
            [[ "$account_code" == "200" ]] || { echo "::error::Token Cloudflare nao validou (HTTP $user_code / $account_code)."; exit 1; }
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/cf-verify.json',encoding='utf-8') as f:
              data=json.load(f)
          if not data.get("success") or data.get("result",{}).get("status") != "active":
              raise SystemExit("::error::Token Cloudflare nao esta ativo.")
          print("Token Cloudflare ativo. Permissoes de publicacao ainda precisam ser verificadas no primeiro deploy de teste.")
          PY

      - name: Verificar acesso ao catalogo Anthropic (sem consumir tokens)
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' --header "x-api-key: $ANTHROPIC_API_KEY" --header "anthropic-version: 2026-10-21" 'https://api.anthropic.com/v1/models?limit=1')"
          if [[ "$code" == "200" ]]; then
            echo "Anthropic API OK (consulta de modelos, sem chamada de geracao)."
          else
            echo "::error::Anthropic respondeu HTTP $code. Revise permissao/chave/faturamento."
            exit 1
          fi

      - name: Checar formato da chave Resend sem enviar email
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESEND_API_KEY" == re_* ]] || { echo "::error::RESEND_API_KEY nao tem formato esperado."; exit 1; }
          echo "Resend presente. Esta etapa nao valida envio nem dominio; isso sera testado separadamente."
          echo "### Verificacao de infraestrutura" >> "$GITHUB_STEP_SUMMARY"
          echo "PostgreSQL, chave Supabase, token Cloudflare e API Anthropic validados sem deploy." >> "$GITHUB_STEP_SUMMARY"
          echo "Resend: formato checado; dominio, SMTP, OAuth e pagamentos requerem testes adicionais." >> "$GITHUB_STEP_SUMMARY"
